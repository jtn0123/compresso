version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/.github/release"
    schedule:
      interval: "weekly"
    groups:
      release-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/compresso/webserver"
    schedule:
      interval: "weekly"
    groups:
      webserver-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/compresso/webserver/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    # openapi-typescript still declares `peer typescript@^5.x` as of 7.13.0, so a
    # TypeScript 7 bump makes `npm ci` fail with ERESOLVE and takes the whole
    # frontend group down with it. Hold TypeScript at 5.x until openapi-typescript
    # ships a release that accepts 7, then drop this ignore.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
