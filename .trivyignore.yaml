# Trivy vulnerability suppressions.
#
# Every entry MUST carry a `statement` explaining why the finding is not
# reachable and an `expired_at` date by which it should have been resolved.
# Trivy stops applying a suppression once `expired_at` passes, so a stale
# entry turns the image scan red instead of hiding a real finding forever.
# `scripts/check-trivyignore.py` enforces both fields in CI.

