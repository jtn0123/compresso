# Gitleaks configuration for Compresso
# Reduces false positives for this specific project.
#
# The rules below are deliberately wider than the obvious `password = "..."`
# shape. A rule that matches only quoted assignments will miss a bare
# `TOKEN=<digits>` in a helper script; shell scripts assign secrets bare and
# abbreviate the variable name, so the rules have to cover that too.

title = "Compresso gitleaks config"
# The upstream default ruleset (AWS keys, GitHub PATs, Slack/Stripe tokens,
# private keys, ...) runs in addition to the project rules below. Without this,
# a custom config REPLACES the built-in ruleset entirely, so every well-known
# provider credential format goes unscanned while the report still says "clean".
[extend]
useDefault = true

[allowlist]
description = "Allowlisted files and patterns"

# Example/sample files only. Note there is deliberately no blanket '.*\.md$'
# entry: docs are exactly where a copy-pasted working command tends to land.
paths = [
    '''\.env\.example$''',

    # Pinned dependency manifests. Hashes and long version pins in these are
    # not credentials, and they churn on every dependency bump.
    '''requirements.*\.(txt|lock)$''',

    # Vendored FullCalendar demo page, present only in history (the whole
    # webserver/assets/global/plugins/ tree is gone at HEAD). It ships upstream
    # with FullCalendar's own throwaway Google Calendar key and the adjacent
    # comment "THIS KEY WON'T WORK IN PRODUCTION!!!"; it was never ours and was
    # never live. Scoped to this one file rather than the vendored tree so any
    # other credential shape under plugins/ still reports.
    '''(^|/)webserver/assets/global/plugins/fullcalendar/demos/gcal\.html$''',
]

# Placeholder values, not real credentials.
regexes = [
    '''(?i)your[_-]?[a-z]*[_-]?(pass|key|token)''',
    '''(?i)YOUR_[A-Z_]*(PASS|SSID|TOKEN|KEY)''',
    '''(?i)(changeme|placeholder|example|redacted|xxxxx+)''',
    '''\$\{[A-Z_]+\}''',       # ${API_TOKEN} style indirection
    '''\$[A-Z_]{3,}''',        # $API_TOKEN style indirection
    '''["']?:\?[A-Z_ ]+not set''',  # ${VAR:?VAR not set} shell guards

    # <worker API token> -- the angle-bracket placeholder convention the docs
    # use. A value that opens with '<' is a fill-in-the-blank, not a secret.
    '''^<''',

    # Value is a call, not a literal: TEST_WORKER_TOKEN = _test_token("worker").
    # A real leaked credential is a literal; a call is indirection, which is
    # the thing we want people doing.
    '''^[A-Za-z_][A-Za-z0-9_.]*\(''',
]

# Bare shell-style assignment of a credential: PASS=hunter2, API_TOKEN=...,
# DEPLOY_SECRET=... Unquoted or quoted, any variable name ending in
# PASS/PASSWD/PASSWORD/SECRET/TOKEN.
#
# Deliberately CASE-SENSITIVE, unlike the ESP32-Garage-Fan original this is
# adapted from. That repo is shell and C, where a case-insensitive match is
# free. This is a TypeScript/JavaScript repo, where `(?i)` turns
# `[A-Z0-9_]*PASS` into a match for every camelCase identifier in the codebase
# -- firstPass, nextToken and friends. A scanner that cries wolf gets switched
# off, so the SCREAMING_SNAKE env/shell shape is matched here and lower-case
# credential assignments are covered by `credential-string-literal` below.
#
# The value must be at least 6 characters, so that separator and sentinel
# constants (`TOKEN = '|'` and the like) do not read as credentials. Six is
# well under any real password, so nothing that matters is given up.
[[rules]]
id = "bare-credential-assignment"
description = "Bare credential assignment (shell/env style)"
regex = '''\b[A-Z0-9_]*(?:PASS(?:WD|WORD)?|SECRET|TOKEN)\s*=\s*["']?([^\s"'#$][^\s"'#]{5,})'''
secretGroup = 1
# Keywords are a lower-cased substring prefilter, not part of the match.
keywords = ["pass", "secret", "token"]

# Any-case credential assigned a quoted string literal: apiKey = "...",
# password: '...'. Requires a quoted value of some length and entropy so that
# `isFirstPass = true` and `token = parts[0]` do not trip it.
[[rules]]
id = "credential-string-literal"
description = "Credential assigned a string literal"
regex = '''(?i)\b(?:pass(?:wd|word)|secret|token|api[_-]?key)["']?\s*[:=]\s*["']([^"'\s]{8,})["']'''
secretGroup = 1
entropy = 3.5
keywords = ["pass", "secret", "token", "key"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:api[_\s]?key|apikey)["']?\s*[:=]\s*["']([a-zA-Z0-9]{32,})["']'''
secretGroup = 1
entropy = 4.5
keywords = ["api", "key"]

[rules.allowlist]
paths = [
    '''.*\.example''',
    '''.*\.sample''',
]
